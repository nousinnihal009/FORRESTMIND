[project]
name = "forestmind"
version = "0.1.0"
description = "Multimodal Forest Intelligence & Tipping-Point Early Warning System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ForestMind Team" }]

dependencies = [
    "torch>=2.0",
    "einops>=0.7",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forestmind*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
