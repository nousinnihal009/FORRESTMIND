[project]
name = "forestmind"
version = "0.6.0"
description = "Forest monitoring, multimodal research, and evidence-based early-warning workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ForestMind Team" }]

dependencies = [
    "torch>=2.0",
    "einops>=0.7",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "pydantic>=2.8",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.31",
]
geo = [
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
]
real-data = [
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "rasterio>=1.3",
    "shapely>=2.0",
]
foundation = [
    "terratorch>=1.1",
    "transformers>=4.35",
    "safetensors>=0.4",
    "huggingface-hub>=0.20",
]
all = [
    "forestmind[geo,real-data,foundation,web]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forestmind*"]

[tool.setuptools.package-data]
forestmind = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
