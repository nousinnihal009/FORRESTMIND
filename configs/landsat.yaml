# ForestMind — Landsat Historical Data Configuration
# Uses Landsat-8/9 data harmonized to Sentinel-2 equivalent

# ─── Data ───────────────────────────────────────────────
data:
  source: landsat                # sentinel2 | landsat | multi
  cache_dir: data/real
  patch_size: 128
  num_bands: 12                  # After harmonization to S2-equivalent
  sar_channels: 2
  time_steps: 12
  batch_size: 4
  num_workers: 2

  # Landsat specific
  landsat:
    max_cloud_cover: 25
    resolution: 30               # native Landsat resolution (meters)
    platforms:                   # which Landsat satellites
      - landsat-8
      - landsat-9
    harmonize: true              # harmonize to Sentinel-2 equivalent bands

  # Study region (Congo Basin subset)
  region:
    name: congo_salonga
    west: 20.0
    south: -3.0
    east: 22.0
    north: -1.0
    start_date: "2020-01-01"
    end_date: "2024-01-01"

# ─── Foundation Model ──────────────────────────────────
foundation:
  name: custom_vit
  embedding_dim: 256
  custom_vit:
    patch_embed_size: 16
    depth: 6
    num_heads: 8
    mlp_ratio: 4.0
    drop_rate: 0.1

# ─── Fusion ────────────────────────────────────────────
fusion:
  method: cross_attention
  num_heads: 4
  num_layers: 2
  dropout: 0.1

# ─── Temporal Transformer ─────────────────────────────
temporal:
  depth: 4
  num_heads: 8
  dim_feedforward: 512
  dropout: 0.1
  max_seq_len: 48
  use_continuous_pe: true

# ─── Prediction Heads ─────────────────────────────────
heads:
  health:
    num_classes: 5
    continuous_score: true
  attribution:
    num_drivers: 8
    multi_label: true
  trajectory:
    horizons: [30, 180, 365, 1095, 1825]
    predict_uncertainty: true

# ─── Training ─────────────────────────────────────────
training:
  epochs: 50
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 5
  gradient_clip: 1.0
  loss_weights:
    health_ce: 1.0
    health_mse: 0.5
    attribution_bce: 1.0
    trajectory_mse: 2.0
    trajectory_huber: 1.0
  use_amp: false
  checkpoint_dir: checkpoints/landsat
  save_every: 5

# ─── Risk Engine ───────────────────────────────────────
risk_engine:
  csd:
    window_size: 6
    ar1_threshold: 0.8
  variance:
    window_size: 6
    amplification_threshold: 1.5
  tipping_point:
    risk_weights:
      csd: 0.25
      variance: 0.20
      autocorrelation: 0.20
      fragmentation: 0.15
      drought_sensitivity: 0.20
  intervention:
    scenarios:
      - name: no_intervention
        driver_reduction: {}
      - name: conservation_corridor
        driver_reduction: { logging: 0.6, road: 0.4 }

device: cpu
seed: 42
