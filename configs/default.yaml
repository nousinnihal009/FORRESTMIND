# ForestMind — Default Training Configuration
# CPU-first development, GPU-ready

# ─── Data ───────────────────────────────────────────────
data:
  source: synthetic          # synthetic | sentinel2 | landsat
  patch_size: 128            # pixels (128 × 128 = 1.28km × 1.28km at 10m)
  num_bands: 12              # Sentinel-2 equivalent bands
  sar_channels: 2            # VV + VH
  time_steps: 12             # monthly snapshots over 1 year
  num_train_samples: 2000
  num_val_samples: 400
  num_test_samples: 200
  batch_size: 4              # small for CPU
  num_workers: 0             # 0 for CPU compatibility

# ─── Foundation Model ──────────────────────────────────
foundation:
  name: custom_vit           # custom_vit | prithvi | terramind
  embedding_dim: 256
  # CustomViT-specific
  custom_vit:
    patch_embed_size: 16     # ViT patch size
    depth: 6                 # transformer layers
    num_heads: 8
    mlp_ratio: 4.0
    drop_rate: 0.1
  # Prithvi-specific (used when foundation.name = prithvi)
  prithvi:
    model_name: "ibm-nasa-geospatial/Prithvi-EO-2.0-300M"
    freeze: true
  # TerraMind-specific
  terramind:
    model_name: "terramind-base"
    freeze: true

# ─── Fusion ────────────────────────────────────────────
fusion:
  method: cross_attention    # cross_attention | concat | gated
  num_heads: 4
  num_layers: 2
  dropout: 0.1

# ─── Temporal Transformer ─────────────────────────────
temporal:
  depth: 4                   # transformer layers
  num_heads: 8
  dim_feedforward: 512
  dropout: 0.1
  max_seq_len: 48            # max time steps
  use_continuous_pe: true    # continuous temporal positional encoding

# ─── Prediction Heads ─────────────────────────────────
heads:
  health:
    num_classes: 5           # Healthy, Stressed, Degraded, Severely Degraded, Cleared
    continuous_score: true   # also predict 0-100 continuous score
  attribution:
    num_drivers: 8           # agriculture, cattle, mining, logging, road, fire, drought, urban
    multi_label: true
  trajectory:
    horizons: [30, 180, 365, 1095, 1825]  # days: 30d, 6mo, 1yr, 3yr, 5yr
    predict_uncertainty: true

# ─── Training ─────────────────────────────────────────
training:
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine          # cosine | step | plateau
  warmup_epochs: 5
  gradient_clip: 1.0
  # Multi-task loss weights
  loss_weights:
    health_ce: 1.0
    health_mse: 0.5
    attribution_bce: 1.0
    trajectory_mse: 2.0
    trajectory_huber: 1.0
  # Mixed precision (GPU only)
  use_amp: false
  # Checkpointing
  checkpoint_dir: checkpoints
  save_every: 5

# ─── Risk Engine ──────────────────────────────────────
risk_engine:
  # Critical Slowing Down
  csd:
    window_size: 6           # time steps for rolling analysis
    ar1_threshold: 0.8       # AR(1) coefficient threshold for warning
  # Variance amplification
  variance:
    window_size: 6
    amplification_threshold: 1.5
  # Tipping-point estimation
  tipping_point:
    risk_weights:
      csd: 0.25
      variance: 0.20
      autocorrelation: 0.20
      fragmentation: 0.15
      drought_sensitivity: 0.20
  # Intervention simulator
  intervention:
    scenarios:
      - name: no_intervention
        driver_reduction: {}
      - name: conservation_corridor
        driver_reduction: { logging: 0.6, road: 0.4 }
      - name: fire_management
        driver_reduction: { fire: 0.7, drought: 0.2 }
      - name: full_protection
        driver_reduction: { agriculture: 0.8, cattle: 0.8, mining: 0.9, logging: 0.9, road: 0.7 }

# ─── Device ───────────────────────────────────────────
device: auto                 # auto | cpu | cuda | mps
seed: 42
